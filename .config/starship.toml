add_newline = false
format = """
$python$directory$git_branch$git_status
$character
"""
[directory]
style = "bold cyan"
truncate_to_repo = true
[git_branch]
symbol = ""
style = "bold purple"
[git_status]
format = '([$staged$modified$untracked$deleted$renamed$conflicted$ahead_behind]($style)) '
style = "bold yellow"
staged = "[+$count ](green)"
modified = "[!$count ](yellow)"
untracked = "[?$count ](cyan)"
deleted = "[✘$count ](red)"
renamed = "[»$count ](purple)"
conflicted = "[⚔$count ](red)"
ahead = "[⇡$count ](purple)"
behind = "[⇣$count ](orange)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count} ](orange)"
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'
[python]
symbol = " "
format = '[$symbol(\($virtualenv\))](green) '
